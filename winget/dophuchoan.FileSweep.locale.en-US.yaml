ShortDescription: Fast file search, duplicate finder and disk cleanup for Windows.
Description: FileSweep scans a drive once, then lets you search millions of files instantly, find true duplicates by content hash (BLAKE3, hardlink-aware), and see exactly what is using your disk — with conservative cleanup suggestions, protected zones for app-managed data, and Recycle Bin deletes by default. Native Rust app, no installer, no telemetry, works fully offline.
