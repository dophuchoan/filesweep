[package]
name = "filesweep"
version = "1.1.0"
edition = "2021"
description = "Fast file search, duplicate finder and disk cleanup for Windows (Rust)"
license = "MIT"

[lib]
name = "filesweep"
path = "src/lib.rs"

[[bin]]
name = "FileSweep"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "filesweep-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:trash", "dep:open"]

[dependencies]
walkdir = "2"
blake3 = { version = "1", features = ["pure"] }

eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
trash = { version = "5", optional = true }
open = { version = "5", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
